spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: create

jwt:
  secret: ${JWT_SECRET}

app:
  frontend-url: http://localhost:5173
  cookie:
    secure: false
    same-site: Lax

upload:
  root: ${user.dir}/uploads
  base-url: http://localhost:8080

logging:
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace
