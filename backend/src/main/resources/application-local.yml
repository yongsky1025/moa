spring:
  config:
    activate:
      # 로컬 개발 환경에서만 적용되는 설정
      on-profile: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations:
        - classpath:seed-data.sql
        - classpath:dummy-data.sql
        - classpath:dummy-data-place.sql
        - classpath:reset-board-post-reply-dummy.sql

app:
  # 프론트 로그인/리다이렉트 기준 URL (로컬)
  frontend-url: http://localhost:5173
  cors:
    # 로컬 브라우저에서 백엔드 호출을 허용할 Origin
    allowed-origin-patterns: http://localhost:5173

upload:
  root: ${user.dir}/uploads
  base-url: http://localhost:8080

logging:
  level:
    com:
      soldesk:
        moa: debug
    org:
      springframework:
        web: debug
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace
