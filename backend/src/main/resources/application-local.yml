spring:
  config:
    activate:
      # 로컬 개발 환경에서만 적용되는 설정
      on-profile: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: create

jwt:
  secret: ${JWT_SECRET}

app:
  # 프론트 로그인/리다이렉트 기준 URL (로컬)
  frontend-url: http://localhost:5173
  cors:
    # 로컬 브라우저에서 백엔드 호출을 허용할 Origin
    allowed-origin-patterns: http://localhost:5173
  cookie:
    secure: false
    same-site: Lax

upload:
  root: ${user.dir}/uploads
  base-url: http://localhost:8080

logging:
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace
