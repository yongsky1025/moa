<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Chat Test</title>
<style>
  body { font-family: monospace; background:#1e1e1e; color:#d4d4d4; padding:20px; }
  h2 { color:#4fc1ff; }
  .box { background:#252526; border-radius:8px; padding:16px; margin:12px 0; }
  label { color:#9cdcfe; display:block; margin:6px 0 2px; }
  input { background:#3c3c3c; border:1px solid #555; color:#d4d4d4; padding:5px 8px; border-radius:4px; width:180px; }
  button { padding:7px 14px; border:none; border-radius:4px; cursor:pointer; font-weight:bold; margin:4px 4px 0 0; }
  .g{background:#4caf50;color:#fff} .b{background:#2196f3;color:#fff}
  .r{background:#f44336;color:#fff} .o{background:#ff9800;color:#fff}
  #log { height:320px; overflow-y:auto; background:#0d0d0d; padding:12px;
         border-radius:4px; border:1px solid #444; white-space:pre-wrap; font-size:13px; }
  .s{color:#4ec9b0} .v{color:#ce9178} .i{color:#808080} .e{color:#f44336}
  .badge { display:inline-block; padding:3px 10px; border-radius:10px; font-size:12px; }
  .on{background:#4caf50;color:#fff} .off{background:#555;color:#ccc}
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<h2>채팅 테스트 콘솔</h2>

<div class="box">
  <b>1. WebSocket 연결</b>
  <div class="row" style="margin-top:10px">
    <div><label>JWT 토큰 (Bearer 제외)</label><input id="token" type="text" style="width:400px" placeholder="eyJhbGc..."></div>
  </div>
  <div class="row" style="margin-top:8px">
    <div><label>roomId</label><input id="roomId" type="number" value="2"></div>
  </div>
  <br>
  <button class="g" onclick="connect()">연결</button>
  <button class="r" onclick="disconnect()">해제</button>
  <span id="badge" class="badge off">연결 안됨</span>
</div>

<div class="box">
  <b>2. 채팅방 생성 (REST)</b><br><br>
  <label>1:1 채팅 – otherId</label>
  <div class="row">
    <input id="otherId" type="number" value="2">
    <button class="b" onclick="createDirect()">1:1 방 생성</button>
  </div>
  <label style="margin-top:10px">모임 채팅 – circleId</label>
  <div class="row">
    <input id="circleId" type="number" value="10">
    <button class="b" onclick="createGroup()">모임 방 생성</button>
  </div>
</div>

<div class="box">
  <b>3. 메시지 전송 (WebSocket)</b><br><br>
  <div class="row">
    <input id="msg" type="text" value="안녕하세요!" style="width:260px" onkeydown="if(event.key==='Enter')send()">
    <button class="o" onclick="send()">전송</button>
  </div>
</div>

<div class="box">
  <b>4. REST 조회</b><br><br>
  <button class="b" onclick="getMessages()">메시지 내역</button>
  <button class="b" onclick="getUnread()">안읽은 수</button>
  <button class="b" onclick="markRead()">읽음 처리</button>
</div>

<div class="box">
  <b>로그</b>
  <button style="float:right;background:#444;color:#ccc;border:none;padding:3px 10px;border-radius:4px;cursor:pointer" onclick="document.getElementById('log').innerHTML=''">지우기</button>
  <div id="log" style="margin-top:8px"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
let stomp = null;

function log(msg, cls='i') {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.innerHTML += `<span class="${cls}">[${t}] ${msg}\n</span>`;
  el.scrollTop = el.scrollHeight;
}
const token  = () => document.getElementById('token').value.trim();
const roomId = () => +document.getElementById('roomId').value;

function connect() {
  if (stomp?.connected) { log('이미 연결됨'); return; }
  if (!token()) { log('토큰을 입력하세요', 'e'); return; }
  const sock = new SockJS('/ws/chat');
  stomp = Stomp.over(sock);
  stomp.debug = null;
  stomp.connect({ 'Authorization': 'Bearer ' + token() },
    () => {
      document.getElementById('badge').className = 'badge on';
      document.getElementById('badge').textContent = '연결됨';
      log('✅ 연결 성공');
      stomp.subscribe('/topic/room/' + roomId(), frame => {
        const m = JSON.parse(frame.body);
        log(`📨 수신 | sender:${m.senderId} | ${m.content}`, 'v');
      });
      log(`📌 /topic/room/${roomId()} 구독`);
    },
    err => {
      document.getElementById('badge').className = 'badge off';
      document.getElementById('badge').textContent = '연결 실패';
      log('❌ ' + err, 'e');
    }
  );
}
function disconnect() {
  stomp?.disconnect(() => log('🔌 해제'));
  document.getElementById('badge').className = 'badge off';
  document.getElementById('badge').textContent = '연결 안됨';
}
function send() {
  if (!stomp?.connected) { log('먼저 연결하세요', 'e'); return; }
  const content = document.getElementById('msg').value.trim();
  if (!content) return;
  stomp.send('/app/chat/' + roomId(), {}, JSON.stringify({ content }));
  log(`📤 전송 → room:${roomId()} | ${content}`, 's');
}

async function createDirect() {
  const res = await fetch(`/api/chat/rooms/direct?myId=${myId()}&otherId=${document.getElementById('otherId').value}`, {method:'POST'});
  const d = await res.json();
  log(`✅ 1:1 방 생성 → roomId: ${d.roomId}`);
}
async function createGroup() {
  const res = await fetch(`/api/chat/rooms/group?circleId=${document.getElementById('circleId').value}&myId=${myId()}`, {method:'POST'});
  const d = await res.json();
  log(`✅ 모임 방 생성 → roomId: ${d.roomId}`);
}
async function getMessages() {
  const res = await fetch(`/api/chat/rooms/${roomId()}/messages?userId=${myId()}&page=0&size=20`);
  const d = await res.json();
  log(`📋 내역 (총 ${d.totalElements}개):`);
  d.content.forEach(m => log(`  sender:${m.senderId} | ${m.content}`, 'v'));
}
async function getUnread() {
  const res = await fetch(`/api/chat/rooms/${roomId()}/unread?userId=${myId()}`);
  const d = await res.json();
  log(`🔔 안읽은 메시지: ${d.unreadCount}개`);
}
async function markRead() {
  await fetch(`/api/chat/rooms/${roomId()}/read?userId=${myId()}`, {method:'POST'});
  log(`✅ 읽음 처리 완료`);
}
</script>
</body>
</html>
