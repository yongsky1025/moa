spring:
  config:
    activate:
      # 운영 배포 환경에서만 적용되는 설정
      on-profile: prod
  jpa:
    hibernate:
      # validate, update
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      # never, always
      mode: always
      data-locations:
        - classpath:seed-data.sql
        - classpath:dummy-data.sql
        - classpath:dummy-data-place.sql
        - classpath:reset-board-post-reply-dummy.sql

app:
  # 운영 프론트 도메인 URL (OAuth 리다이렉트 등에 사용)
  frontend-url: ${APP_FRONTEND_URL}
  cors:
    # 운영 프론트 도메인 Origin (배포 시 환경변수로 주입)
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERN}
  cookie:
    # 운영(HTTPS) 기본값: 크로스 사이트 요청에서도 refresh 쿠키를 보내기 위해 None+Secure 권장
    secure: true
    same-site: None

upload:
  # 운영 스토리지 경로 (서버 파일시스템)
  root: ${FILE_UPLOAD_DIR}
  # 업로드 파일 URL 생성 기준 도메인 (백엔드 도메인)
  base-url: ${APP_BACKEND_URL}

server:
  # 리버스 프록시(Nginx/ALB) 뒤에서 원본 스킴/호스트 인식
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: true
      pattern: '%h %l %u %t "%r" %s %b %D'

logging:
  level:
    com:
      soldesk:
        moa: info
    org:
      springframework:
        web: info
      hibernate:
        SQL: info
