spring:
  security:
    oauth2:
      client:
        registration:
          google:
            # 구글 OAuth 앱의 클라이언트 식별자/비밀키 (.env)
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # 구글 클라우드 콘솔에 등록된 Redirect URI와 반드시 일치해야 함
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            # 구글에서 사용자에게 동의받을 권한 범위
            scope:
              - profile
              - email
          kakao:
            # 카카오 OAuth 앱의 REST API 키/Client Secret (.env)
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            # 카카오는 client_secret_post 방식 권장
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # 카카오 개발자 콘솔에 등록된 Redirect URI와 반드시 일치해야 함
            redirect-uri: ${KAKAO_REDIRECT_URI}
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
            # 아래 provider.kakao 설정을 사용
            provider: kakao
          naver:
            # 네이버 OAuth 앱의 Client ID/Client Secret (.env)
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope:
              - nickname
              - email
            client-name: Naver
            authorization-grant-type: authorization_code
            # 네이버 개발자센터에 등록된 Callback URL과 반드시 일치해야 함
            redirect-uri: ${NAVER_REDIRECT_URI}
        provider:
          kakao:
            # 카카오 OAuth2 엔드포인트
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            # 네이버 OAuth2 엔드포인트
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 네이버 사용자 정보는 response 하위에 실제 필드가 들어있음
            user-name-attribute: response
