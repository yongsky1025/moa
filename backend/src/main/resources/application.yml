# 테이블 자동 생성 여부
# none : 운영환경
# validate : 엔티티와 테이블 정상 매핑 확인(운영환경)
# create : 기존 테이블 삭제 후 테이블 생성(개발시)
# create-drop : 기존 테이블 삭제 후 테이블 생성, 종료 시점에 테이블 삭제(개발시)
# update : 변경된 부분만 적용(기존 컬럼 제거는 안해줌)(개발시)
