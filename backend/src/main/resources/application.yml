spring:
  application:
    name: moa
  profiles:
    include: oauth2
  # Redis (채팅 메시지 브로커)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

# 파일 업로드 경로
file:
  upload-dir: ${FILE_UPLOAD_DIR:${user.dir}/uploads}

jwt:
  secret: ${JWT_SECRET}
  access-exp-ms: 1800000
  refresh-exp-ms: 1209600000

app:
  cookie:
    secure: false
    same-site: Lax

logging:
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace

# 실제 파일이 저장될 경로 (WebConfig에서 /images/** 로 서빙)
upload:
  path: ${UPLOAD_PATH:${user.home}/upload}

# 소셜(구글) → application-oauth2.yml 로 분리됨
