spring:
  application:
    name: moa
  # DB 서버 연동 정보
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/moa
    username: team_moa
    password: 12345
  # 테이블 자동 생성 여부
  jpa:
    hibernate:
      ddl-auto: update
      # sql 구문 예쁘게 출력
    properties:
      hibernate:
        "[format_sql]": true
        "[highlight_sql]": true
  profiles:
    include: oauth2,local
  # Redis (채팅 메시지 브로커)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

# 파일 업로드 경로
file:
  upload-dir: ${FILE_UPLOAD_DIR:${user.dir}/uploads}

jwt:
  secret: ${JWT_SECRET}
  access-exp-ms: 1800000
  refresh-exp-ms: 1209600000

app:
  frontend-url: http://localhost:5173
  local-upload-dir: ${APP_LOCAL_UPLOAD_DIR:${upload.path}}
  local-base-url: ${APP_LOCAL_BASE_URL:http://localhost:8080}
  cookie:
    secure: false
    same-site: Lax

logging:
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace

# 실제 파일이 저장될 경로 (WebConfig에서 /images/** 로 서빙)
upload:
  path: ${UPLOAD_PATH:${user.home}/upload}

# 소셜(구글) → application-oauth2.yml 로 분리됨
