spring:
  application:
    name: moa
  # DB 서버 연동 정보
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/moa
    username: root
    password: 12345
  # 테이블 자동 생성 여부
  jpa:
    hibernate:
      ddl-auto: create
      # sql 구문 예쁘게 출력
    properties:
      hibernate:
        "[format_sql]": true
        "[highlight_sql]": true
  profiles:
    include: oauth2
  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

# JWT
jwt:
  secret: 238ef5a0a77a9d3335b778313550888ce82f391d84b5cc4f9de6d4bb74335f883515c43a547e306f608572196b0c04fff6be43336909bcc13bcd404cc7a2d2bf
  access-exp-ms: 1800000
  refresh-exp-ms: 1209600000

# CORS (React dev 예시)
cors:
  allowed-origins: http://localhost:5173

# Cookie env (선택: 로컬/운영 분기용)
app:
  cookie:
    secure: false
    same-site: Lax

# 로그출력(개발용)
logging:
  level:
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace

# 실제 파일이 저장될 경로 (WebConfig에서 /images/** 로 서빙)
upload:
  path: ${user.home}/upload

