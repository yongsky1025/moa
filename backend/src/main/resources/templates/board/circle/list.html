<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout}"
>
  <head>
    <title layout:fragment="title">써클 - 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container-fluid" layout:fragment="content">
      <div class="board-list-page">
        <div class="wrap">
          <div class="topbar">
            <h1 class="title">써클 게시판</h1>
          </div>

          <div class="board-layout">
            <!-- 보드별 게시글 -->
            <section class="card-box">
              <div class="card-header d-flex align-items-center justify-content-between">
                <div>
                  <span class="text-muted ms-2" id="selectedBoardName">(보드 선택)</span>
                </div>

                <div class="d-flex gap-2">
                  <button
                    class="btn-primary-like"
                    type="button"
                    id="writePostBtn"
                    onclick="location.href = '/circle/${circleId}/board/new'"
                  >
                    글쓰기
                  </button>
                </div>
              </div>

              <div class="card-body p-0">
                <table class="table-basic">
                  <thead>
                    <tr>
                      <th class="col-no">no.</th>
                      <th class="col-board">구분</th>
                      <th id="postTitle">제목</th>
                      <th class="col-author">작성자</th>
                      <th class="col-date">작성일</th>
                      <th class="col-views">조회수</th>
                      <th class="col-replyCnt">댓글</th>
                    </tr>
                  </thead>

                  <tbody id="postTableBody"></tbody>

                  <tbody id="emptyRow" style="display: none">
                    <tr>
                      <td colspan="7" class="empty">게시글이 없습니다.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            <!-- 보드 리스트 -->
            <aside class="card-box" id="boardPanel">
              <div class="card-header d-flex align-items-center justify-content-between">
                <span>보드 목록</span>
                <div class="d-flex align-items-center gap-2">
                  <button class="btn btn-sm btn-outline-secondary" type="button" id="revertBoardEditBtn">
                    되돌리기
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" type="button" id="toggleBoardEditBtn">수정</button>
                </div>
              </div>

              <div class="card-body">
                <div class="d-grid gap-2" id="boardList"></div>

                <div class="board-add-form">
                  <input class="form-control" type="text" id="boardNameInput" placeholder="보드명 입력" />
                  <button class="btn btn-sm btn-primary" type="button" id="boardAddBtn">추가</button>
                </div>
              </div>
            </aside>
          </div>
        </div>
      </div>
      <script th:src="@{/board/circle/list.js}"></script>
    </div>
    <!-- /.container-fluid -->
  </body>
</html>
