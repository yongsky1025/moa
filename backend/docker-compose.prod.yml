services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FILE_UPLOAD_DIR: ${FILE_UPLOAD_DIR:?set_FILE_UPLOAD_DIR}
    volumes:
      - ${FILE_UPLOAD_DIR:?set_FILE_UPLOAD_DIR}:${FILE_UPLOAD_DIR:?set_FILE_UPLOAD_DIR}
    ports:
      - "127.0.0.1:8080:8080"

  meilisearch:
    environment:
      MEILI_ENV: production
    expose:
      - "7700"
